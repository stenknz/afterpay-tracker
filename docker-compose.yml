services:
  afterpay-tracker:
    image: stenknz/afterpay-tracker:latest
    container_name: afterpay-tracker
    restart: unless-stopped
    ports:
      - "7672:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/dev.db
      # WARNING: Change these secrets before deploying to any non-local environment!
      - AUTH_SECRET=changeme
      - NEXTAUTH_SECRET=changeme
      - NEXTAUTH_URL=http://localhost:7672
      - AUTH_TRUST_HOST=true
    volumes:
      - ./Data:/data
      - ./Data/uploads:/app/public/uploads
