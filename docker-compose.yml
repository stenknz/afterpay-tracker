services:
  bnpl-track:
    image: stenknz/bnpl-track:latest
    container_name: bnpl-track
    restart: unless-stopped
    ports:
      - "7672:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/dev.db
      - AUTH_SECRET=changeme
      - NEXTAUTH_SECRET=changeme
      - NEXTAUTH_URL=http://localhost:7672
      - AUTH_TRUST_HOST=true
    volumes:
      - ./Data:/data
      - ./Data/uploads:/app/public/uploads
